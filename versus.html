<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152c27"><title>英雄塔防：邊境對戰原型</title><link rel="stylesheet" href="versus.css"></head>
<body><main class="versus-shell"><header><div><small>FRONTIER VERSUS · MVP</small><h1>邊境對戰</h1></div><div class="match-clock"><b id="versus-time">12:00</b><span id="versus-state">偵察敵軍戰術中</span></div><a href="td.html">返回英雄遠征</a></header>
<section class="battle"><canvas id="versus-game" width="1280" height="720" aria-label="左右雙基地、上下雙路的對戰戰場"></canvas><div id="versus-result" class="result" hidden><h2 id="versus-result-title"></h2><p id="versus-result-copy"></p><button id="versus-restart" type="button">再戰一場</button></div></section>
<section class="control-panel"><div class="status"><span>我方主堡 <b id="player-hp">3000</b></span><span>金幣 <b id="player-gold">500</b></span><span>敵方主堡 <b id="enemy-hp">3000</b></span></div><div class="builds" aria-label="建造選擇"><button id="versus-worker-mode" aria-pressed="true">移動工人</button><button data-build="tower">守望塔<small>130G</small></button><button data-build="infantry">步兵營<small>170G · 12秒</small></button><button data-build="ranger">射手營<small>230G · 18秒</small></button><button data-build="siege">攻城工坊<small>360G · 34秒</small></button></div><div class="lane"><span>部署路線</span><button data-lane="upper" aria-pressed="true">上路</button><button data-lane="lower" aria-pressed="false">下路</button><label>速度 <select id="versus-speed"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option></select></label></div><p id="versus-help">先用「移動工人」靠近施工地點，再選建築並點擊草地；敵方後方需由士兵取得視野。</p></section></main>
<script src="src/versus/namespace.js"></script><script src="src/versus/config.js"></script><script src="src/versus/entities.js"></script><script src="src/versus/AIStrategy.js"></script><script src="src/versus/VersusMatch.js"></script><script src="src/versus/main.js"></script></body></html>
