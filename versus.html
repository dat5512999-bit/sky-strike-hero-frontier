<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152c27"><title>英雄塔防：邊境對戰</title><link rel="stylesheet" href="versus.css"></head>
<body><main class="versus-shell">
<header class="battle-hud"><div class="brand"><small>FRONTIER VERSUS · v0.79.0</small><h1>邊境對戰</h1></div><div class="resource"><span>金幣</span><b id="player-gold">500</b></div><div class="resource blue"><span>我方主堡</span><b id="player-hp">3000</b></div><div class="match-clock"><b id="versus-time">12:00</b><span id="versus-state">偵察敵軍戰術中</span></div><div class="resource red"><span>敵方主堡</span><b id="enemy-hp">3000</b></div><label class="speed">速度<select id="versus-speed"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option></select></label><button id="versus-menu-open" class="icon-button" aria-label="遊戲選單">⚙</button></header>
<section class="battle"><canvas id="versus-game" width="1280" height="720" aria-label="左右雙基地、上下雙路的對戰戰場"></canvas><aside class="worker-card"><div class="worker-portrait">⚒</div><div><b>邊境工匠</b><small>無敵 · 建造／維修</small></div></aside><nav class="quick-rail"><button id="versus-build-open">♜<small>建造</small></button><button id="versus-worker-mode" aria-pressed="true">⌖<small>移動</small></button><button id="versus-rules">?<small>規則</small></button></nav><div id="versus-placement" class="placement" hidden><b id="versus-placement-title">選擇位置</b><small id="versus-placement-copy"></small><button id="versus-placement-confirm">✓ 確認</button><button id="versus-placement-cancel">× 取消</button></div><aside id="versus-selection" class="selection" hidden><button id="versus-selection-close">×</button><small>SELECTED BUILDING</small><h2 id="versus-selection-name"></h2><p id="versus-selection-stats"></p><div><button id="versus-repair">維修</button><button id="versus-demolish">拆除返還 50%</button></div></aside><div id="versus-result" class="result" hidden><h2 id="versus-result-title"></h2><p id="versus-result-copy"></p><button id="versus-restart" type="button">再戰一場</button></div></section>
<section id="versus-build-drawer" class="build-drawer"><div class="drawer-heading"><div><small>RECRUIT / BUILD</small><b>招募與建造</b></div><button id="versus-build-close">×</button></div><div class="lane-picker"><span>部署路線</span><button data-lane="upper" aria-pressed="true">上路</button><button data-lane="lower" aria-pressed="false">下路</button></div><div class="build-grid"><button data-build="tower"><i>🏰</i><b>守望塔</b><small>防守士兵 · 130G</small></button><button data-build="infantry"><i>🛡</i><b>步兵營</b><small>每 12 秒 · 170G</small></button><button data-build="ranger"><i>🏹</i><b>射手營</b><small>每 18 秒 · 230G</small></button><button data-build="siege"><i>⚙</i><b>攻城工坊</b><small>每 34 秒 · 360G</small></button></div><p id="versus-help">先移動工人靠近施工地點，再選擇建築並點擊草地預覽。</p></section>
<div id="versus-menu" class="modal" hidden><div><small>GAME MENU</small><h2>邊境對戰</h2><button id="versus-menu-continue">繼續對戰</button><button id="versus-menu-restart">重新開始</button><a href="td.html">返回英雄遠征</a></div></div><div id="versus-rules-panel" class="modal" hidden><div><button id="versus-rules-close" class="modal-close">×</button><h2>對戰規則</h2><p>工人無敵但不能進入敵方後方。兵營自動出兵；士兵負責交戰、拆塔與攻擊主堡。12 分鐘時間到比較主堡生命與軍備價值。</p></div></div>
</main><script src="src/versus/namespace.js"></script><script src="src/versus/config.js"></script><script src="src/versus/entities.js"></script><script src="src/versus/AIStrategy.js"></script><script src="src/versus/VersusMatch.js"></script><script src="src/versus/main.js"></script></body></html>
