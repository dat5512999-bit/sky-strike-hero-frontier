name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify game
        run: |
          npm run check
          npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp ./*.html ./*.css ./*.webmanifest sw.js .nojekyll _site/
          cp -R assets src _site/
          rm -f _site/codex-dev.html _site/src/td/codex/CodexDebug.js
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live release
        timeout-minutes: 5
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4; do
            if npm run verify:pages -- "$SITE_URL"; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then sleep 20; fi
          done
          exit 1
