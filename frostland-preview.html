<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/icons/game-icon.svg"><title>霜原盟族 · 動作與武器驗收</title><style>*{box-sizing:border-box}body{margin:0;background:#09111b;color:#e9dfc6;font:16px system-ui}main{max-width:1140px;margin:auto;padding:20px}h1{font:32px Georgia,serif;margin:12px 0}p{color:#abc0cb;line-height:1.7}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,a{font:inherit;color:#ece1bf;padding:10px 14px;border:1px solid #607076;border-radius:4px;background:#20313c;cursor:pointer;min-height:44px}button[aria-pressed=true]{background:#436366}canvas{display:block;width:100%;height:auto;border:1px solid #45515a;border-radius:6px}#status{font-size:14px}a{display:inline-block;text-decoration:none}@media(max-width:600px){main{padding:10px}h1{font-size:25px}button{font-size:13px;padding:8px}canvas{min-height:460px;object-fit:contain;background:#10202b}}</style><main><p>HERO FRONTIER · FROSTLAND V1 · TESTABLE</p><h1>霜原盟族：武器與戰鬥動作</h1><p>上排：霜牙・凜與四階獵矛。下排：六種士兵的蓄力、出手與回復。使用與遊戲相同的圖集、武器定位、投射物與特效。</p><nav><button data-state="idle">待機</button><button data-state="walk">移動</button><button data-state="attack" aria-pressed="true">攻擊</button><button data-state="cast">施法</button><button id="pause">暫停檢查</button><button id="sound">音效：關</button></nav><canvas width="1100" height="720" aria-label="四階英雄武器與六兵種動作展示"></canvas><nav><button data-effect="mark">Q 霜痕</button><button data-effect="spear">W 獵矛</button><button data-effect="hunt">E 獵群</button><button data-effect="winter">F 全場寒冬</button><button data-effect="shatter">凍結目標／觀察碎冰</button><a href="td.html">進入遊戲</a></nav><p id="status" role="status">載入動作圖集…</p><p>戰鬥數值屬 V1 測試；故事仍為 CONCEPT／UNKNOWN。士兵的部署位置固定，動畫位移不改變碰撞或射程。</p></main><script src="src/td/mobile-entry.js"></script>
