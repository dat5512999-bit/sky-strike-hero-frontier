<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HERO FRONTIER · 怪物路點編輯器</title>
  <style>:root{color-scheme:dark;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#08110f;color:#edf4ed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#243d35,#07100e 65%);min-height:100vh}.page{max-width:1600px;margin:auto;padding:28px}.eyebrow{color:#e9bf68;letter-spacing:.16em;font-size:12px}h1{margin:.35rem 0;font-size:clamp(25px,4vw,42px)}p{line-height:1.6;color:#bac9c0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0;padding:14px;background:#0b1815;border:1px solid #826b3b}.toolbar button,.toolbar select{border:1px solid #aa8a49;background:#172923;color:#f4e5b4;padding:9px 12px;border-radius:4px;font:inherit;cursor:pointer}.toolbar button:hover{background:#29463a}.toolbar b{color:#8cf0a3;margin-right:auto}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}.map-wrap{overflow:auto;border:1px solid #9a8146;background:#050908;padding:8px}.stage{position:relative}.map{position:absolute;left:0;top:0;background-size:100% 100%;transform-origin:top left}.route-layer{position:absolute;left:0;top:0;overflow:visible;transform-origin:top left}.route-line{fill:none;stroke:#50f1d2;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #063f38)}.route-line.ghost{stroke:#9ba9a5;stroke-width:4;opacity:.52}.route-node{fill:#e9c469;stroke:#17120a;stroke-width:4;cursor:grab}.route-node.locked{fill:#e36b58;cursor:not-allowed}.route-node.selected{fill:#fff6bf;stroke:#fff}.route-node:focus{outline:none;stroke:#fff;stroke-width:6}.sidebar{display:grid;align-content:start;gap:12px;background:#0b1815;border:1px solid #826b3b;padding:16px}.sidebar h2{font-size:18px;margin:0}.hint{border-left:3px solid #e8bc56;padding-left:10px}.notice{color:#edcb76;min-height:48px}.validation{min-height:90px;padding:10px;background:#07100d;border:1px solid #435e50;color:#b8c7be;white-space:pre-wrap}.save-confirm{display:none;gap:8px;background:#332918;border:1px solid #e8bc56;padding:10px}.save-confirm[data-open="true"]{display:grid}@media(max-width:900px){.page{padding:16px}.layout{grid-template-columns:1fr}.sidebar{order:-1}.map-wrap{margin-inline:-16px;border-inline:0}.toolbar b{width:100%;margin-right:0}}</style>
</head>
<body><main class="page" data-route-editor>
  <div class="eyebrow">DEVELOPER STUDIO · ROUTE EDITOR · NOT IN PLAYER UI</div><h1 data-route-title>載入地圖中…</h1><p>拖曳金色節點調整怪物走線。紅色起點與城門固定；開啟「新增轉彎點」後可連續點選加點，直到再次按鈕關閉，切換地圖也會保持開啟。調整完成後，在本機後台按一次「儲存到遊戲」就直接寫入並自動備份，再重新整理 td.html、開始新局即可生效。此按鈕儲存目前這張地圖，換圖前請先儲存。儲存前會檢查障礙、邊界、節點間距與起終點。</p>
  <div class="toolbar"><label>地圖 <select data-route-map></select></label><label>路線 <select data-route-branch></select></label><b data-route-status>載入中…</b><button type="button" data-route-add>新增轉彎點：關</button><button type="button" data-route-delete>刪除選取點</button><button type="button" data-route-reset>還原原始路線</button><button type="button" data-route-save>儲存到遊戲</button><button type="button" data-route-remove>移除已套用版本</button><button type="button" data-route-access>重新檢查管理者權限</button></div>
  <div class="layout"><section class="map-wrap" data-route-wrap><div class="stage" data-route-stage><div class="map" data-route-map-image></div><svg class="route-layer" data-route-svg aria-label="怪物路線編輯區"></svg></div></section><aside class="sidebar"><h2>路線驗證</h2><p class="hint">建議一段一個彎，不要密集堆點；先存成版本再進戰場看怪物預覽。任何不通過的路線都無法套用。</p><div class="validation" data-route-validation></div><div class="notice" data-route-notice aria-live="polite"></div></aside></div>
  <script src="src/td/namespace.js"></script><script src="src/td/config.js"></script><script src="src/td/maps.js"></script><script src="src/td/map-tools/published-maps.js"></script><script src="src/td/map-tools/MapPublisher.js"></script><script src="src/td/map-tools/MapRouteModel.js"></script><script src="src/td/map-tools/MapRouteOverrides.js"></script><script src="src/td/map-tools/MapRouteEditor.js"></script>
</main></body></html>
