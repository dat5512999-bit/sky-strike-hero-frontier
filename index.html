<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061423">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/game-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/game-icon.svg">
  <title>蒼穹突擊 — Phase 1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell" aria-label="蒼穹突擊遊戲">
    <header class="hud" aria-live="polite">
      <div><span class="hud-label">SCORE</span><strong id="score">000000</strong></div>
      <div class="title">蒼穹突擊 <small>PHASE 1</small></div>
      <div><span class="hud-label">HP</span><strong id="health">● ● ●</strong></div>
    </header>
    <section class="stage-wrap">
      <canvas id="game" width="480" height="720" tabindex="0" aria-label="遊戲畫面"></canvas>
      <div id="overlay" class="overlay">
        <div class="panel">
          <p class="eyebrow">VERTICAL STRIKE</p>
          <h1 id="overlay-title">蒼穹突擊</h1>
          <p id="overlay-message">移動滑鼠操控戰機<br>戰機會自動射擊</p>
          <fieldset id="skin-picker" class="skin-picker">
            <legend>選擇外觀包</legend>
            <div id="skin-options" class="skin-options"></div>
          </fieldset>
          <button id="start-button" type="button">開始任務</button>
          <p class="hint">也可按 Enter 開始</p>
        </div>
      </div>
    </section>
    <footer>
      <span class="desktop-help">滑鼠移動：操控戰機　｜　自動射擊　｜　Esc：暫停</span>
      <span class="touch-help">手指拖曳：操控戰機　｜　自動射擊</span>
    </footer>
  </main>
  <aside class="orientation-tip" role="status">↻<strong>請將手機轉為直向</strong><span>直向模式會有最佳操作空間</span></aside>

  <script src="src/namespace.js"></script>
  <script src="src/config.js"></script>
  <script src="src/utils/math.js"></script>
  <script src="src/skins/SkinRegistry.js"></script>
  <script src="src/skins/SkinPacks.js"></script>
  <script src="src/entities/Bullet.js"></script>
  <script src="src/entities/Player.js"></script>
  <script src="src/entities/Enemy.js"></script>
  <script src="src/entities/Boss.js"></script>
  <script src="src/entities/PowerUp.js"></script>
  <script src="src/systems/Weapon.js"></script>
  <script src="src/systems/Collision.js"></script>
  <script src="src/systems/Spawner.js"></script>
  <script src="src/systems/GameState.js"></script>
  <script src="src/systems/Effects.js"></script>
  <script src="src/systems/InputController.js"></script>
  <script src="src/Game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
