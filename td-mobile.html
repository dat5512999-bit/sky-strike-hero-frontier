<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17392f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="英雄塔防">
  <link rel="manifest" href="td.webmanifest">
  <link rel="icon" href="assets/icons/game-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png">
  <title>英雄塔防</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100e;overscroll-behavior:none}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
    .install-trigger{position:fixed;z-index:10;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));min-height:34px;padding:6px 10px;border:1px solid #b89952;border-radius:18px;background:#0b1715e8;color:#e9d59b;font:12px/1.2 system-ui,sans-serif;box-shadow:0 4px 14px #0008}.install-trigger[hidden]{display:none}
    .install-card{position:fixed;z-index:11;left:50%;bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:min(360px,calc(100% - 24px));padding:10px 12px;transform:translateX(-50%);border:1px solid #b89952;border-radius:8px;background:#0b1715f2;color:#e9d59b;box-shadow:0 8px 28px #000b;font:13px/1.45 system-ui,sans-serif}
    .install-card[hidden]{display:none}.install-card strong{font-size:14px}.install-card small{grid-column:1;color:#bac6ba}.install-card button{grid-column:2;grid-row:1/3;min-width:86px;border:1px solid #d5b760;border-radius:5px;background:linear-gradient(#71572d,#332411);color:#fff0bd;font-weight:700}.install-card .dismiss{position:absolute;right:3px;top:-30px;min-width:28px;height:28px;background:#101b19}
    @media (display-mode:standalone),(display-mode:fullscreen){.install-card{display:none!important}}
  </style>
</head>
<body>
  <iframe title="英雄塔防手機遊戲" allow="fullscreen" allowfullscreen></iframe>
  <button id="install-open" class="install-trigger" type="button" hidden>安裝到主畫面</button>
  <aside id="install-card" class="install-card" hidden aria-live="polite"><strong id="install-title">安裝英雄塔防</strong><small id="install-copy">加入主畫面後會以橫向全螢幕開啟。</small><button id="install-action" type="button">安裝</button><button id="install-dismiss" class="dismiss" type="button" aria-label="關閉安裝提示">×</button></aside>
  <script>
    const frame=document.querySelector('iframe');
    // The lobby is deliberately upright. The game itself asks for landscape only
    // after an expedition begins, so Safari chrome and the home navigation stay legible.
    const target=new URL('td.html',location.href);
    target.searchParams.set('mobileShell','1');
    const preview=new URL(location.href).searchParams.get('preview');
    if(preview)target.searchParams.set('preview',preview);
    frame.src=target.href;
  </script>
  <script src="src/td/mobile-pwa.js"></script>
</body>
</html>
