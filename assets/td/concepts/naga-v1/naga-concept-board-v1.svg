<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2500" viewBox="0 0 2400 2500">
  <rect width="2400" height="2500" fill="#06131b"/>
  <rect x="40" y="32" width="2320" height="120" rx="18" fill="#0b2530" stroke="#75c7c1" stroke-width="2"/>
  <text x="92" y="90" fill="#e9d69a" font-family="Microsoft JhengHei, sans-serif" font-size="46" font-weight="700">娜迦概念選擇板 V1</text>
  <text x="92" y="128" fill="#9db9c0" font-family="Microsoft JhengHei, sans-serif" font-size="24">請用編號告訴我：哪些要保留為軍團單位、英雄、敵軍或刪除。</text>
  <g font-family="Microsoft JhengHei, sans-serif">
    <g transform="translate(40 180)"><rect width="540" height="540" rx="14" fill="#10212a" stroke="#4f858a"/><image href="01-tidecaller.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#0a1720"/><text x="24" y="486" fill="#e9d69a" font-size="30" font-weight="700">01　潮汐祭司</text><text x="24" y="520" fill="#a9c7cb" font-size="22">單位候選・支援</text></g>
    <g transform="translate(620 180)"><rect width="540" height="540" rx="14" fill="#10212a" stroke="#4f858a"/><image href="02-reefstalker.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#0a1720"/><text x="24" y="486" fill="#e9d69a" font-size="30" font-weight="700">02　礁影弓手</text><text x="24" y="520" fill="#a9c7cb" font-size="22">單位候選・遠程</text></g>
    <g transform="translate(1200 180)"><rect width="540" height="540" rx="14" fill="#10212a" stroke="#4f858a"/><image href="03-tideguard.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#0a1720"/><text x="24" y="486" fill="#e9d69a" font-size="30" font-weight="700">03　潮汐盾衛</text><text x="24" y="520" fill="#a9c7cb" font-size="22">單位候選・前線</text></g>
    <g transform="translate(1780 180)"><rect width="540" height="540" rx="14" fill="#2d151b" stroke="#ad6a5c"/><image href="04-siltwater-demonlord.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#1b0d12"/><text x="24" y="486" fill="#f0c7a1" font-size="30" font-weight="700">04　淤潮小魔王</text><text x="24" y="520" fill="#d1a6a3" font-size="22">插入篇・Boss</text></g>

    <g transform="translate(40 760)"><rect width="540" height="540" rx="14" fill="#2d151b" stroke="#ad6a5c"/><image href="05-silt-imp.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#1b0d12"/><text x="24" y="486" fill="#f0c7a1" font-size="30" font-weight="700">05　淤泥小惡魔</text><text x="24" y="520" fill="#d1a6a3" font-size="22">怪物・高速騷擾</text></g>
    <g transform="translate(620 760)"><rect width="540" height="540" rx="14" fill="#2d151b" stroke="#ad6a5c"/><image href="06-brine-shellbreaker.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#1b0d12"/><text x="24" y="486" fill="#f0c7a1" font-size="30" font-weight="700">06　鹽殼破門獸</text><text x="24" y="520" fill="#d1a6a3" font-size="22">怪物・重甲</text></g>
    <g transform="translate(1200 760)"><rect width="540" height="540" rx="14" fill="#10212a" stroke="#4f858a"/><image href="07-stormfin-war-matriarch.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#0a1720"/><text x="24" y="486" fill="#e9d69a" font-size="30" font-weight="700">07　飛翼娜迦戰將</text><text x="24" y="520" fill="#a9c7cb" font-size="22">單位候選・空中盾矛</text></g>
    <g transform="translate(1780 760)"><rect width="540" height="540" rx="14" fill="#10212a" stroke="#4f858a"/><image href="08-skycoil-dragoon.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#0a1720"/><text x="24" y="486" fill="#e9d69a" font-size="30" font-weight="700">08　天雷娜迦突擊者</text><text x="24" y="520" fill="#a9c7cb" font-size="22">單位候選・飛行雷矛</text></g>

    <g transform="translate(40 1340)"><rect width="540" height="540" rx="14" fill="#201d37" stroke="#8d80c3"/><image href="09-deep-tide-wargod.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#121024"/><text x="24" y="486" fill="#e0d6ff" font-size="30" font-weight="700">09　深潮戰神</text><text x="24" y="520" fill="#b9b0d9" font-size="22">英雄／Boss 候選</text></g>
    <g transform="translate(620 1340)"><rect width="540" height="540" rx="14" fill="#321a18" stroke="#b86c50"/><image href="10-red-coral-berserker.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#1d0e0c"/><text x="24" y="486" fill="#ffccb0" font-size="30" font-weight="700">10　赤珊瑚狂戰</text><text x="24" y="520" fill="#d7a89a" font-size="22">單位候選・雙刃近戰</text></g>
    <g transform="translate(1200 1340)"><rect width="540" height="540" rx="14" fill="#201d37" stroke="#8d80c3"/><image href="11-obsidian-coil-juggernaut.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#121024"/><text x="24" y="486" fill="#e0d6ff" font-size="30" font-weight="700">11　黑曜重甲</text><text x="24" y="520" fill="#b9b0d9" font-size="22">單位候選・攻城重兵</text></g>
    <g transform="translate(1780 1340)"><rect width="540" height="540" rx="14" fill="#10212a" stroke="#4f858a"/><image href="12-manta-wing-raider.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#0a1720"/><text x="24" y="486" fill="#e9d69a" font-size="30" font-weight="700">12　翼鰩空騎</text><text x="24" y="520" fill="#a9c7cb" font-size="22">單位候選・飛行投刃</text></g>

    <g transform="translate(40 1920)"><rect width="540" height="540" rx="14" fill="#27341a" stroke="#8ba05b"/><image href="13-venom-marsh-stalker.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#151e0c"/><text x="24" y="486" fill="#e2edbd" font-size="30" font-weight="700">13　毒沼獵手</text><text x="24" y="520" fill="#bdc99d" font-size="22">怪物／敵軍・伏擊</text></g>
    <g transform="translate(620 1920)"><rect width="540" height="540" rx="14" fill="#201d37" stroke="#8d80c3"/><image href="14-tidebreaker-hero.png" width="540" height="450" preserveAspectRatio="xMidYMid slice"/><rect y="450" width="540" height="90" fill="#121024"/><text x="24" y="486" fill="#e0d6ff" font-size="30" font-weight="700">14　潮斷者</text><text x="24" y="520" fill="#b9b0d9" font-size="22">娜迦英雄候選</text></g>
    <g transform="translate(1200 1920)"><rect width="1120" height="540" rx="14" fill="#0b1b24" stroke="#4f858a"/><text x="60" y="130" fill="#e9d69a" font-size="44" font-weight="700">選擇時直接回覆編號</text><text x="60" y="205" fill="#c2d8db" font-size="30">例：03、08、10、12 做軍團單位</text><text x="60" y="260" fill="#c2d8db" font-size="30">14 做英雄；04、05、06、13 做敵軍</text><text x="60" y="355" fill="#7fa8ad" font-size="26">這些都是概念圖，尚未接入遊戲、戰鬥或劇情。</text></g>
  </g>
</svg>
