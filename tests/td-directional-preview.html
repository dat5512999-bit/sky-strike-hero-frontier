<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>怪物方向動作樣板</title>
<style>
  body{margin:0;background:#15231f;color:#edf5e5;font:16px system-ui;padding:22px}
  h1{font-size:21px;margin:0 0 8px}p{margin:0 0 18px;color:#b9d6c4}
  canvas{max-width:100%;height:auto;border:1px solid #719275;background:#477447}
</style>
<h1>怪物方向動作樣板</h1>
<p>左至右：向下行走、向上行走、向下攻擊、向上攻擊。上排普通步兵，下排岩甲巨獸。每個角色的腳底應貼齊地面線。</p>
<canvas id="preview" width="1000" height="480"></canvas>
<script src="../src/td/namespace.js"></script>
<script src="../src/td/config.js"></script>
<script src="../src/td/systems/ArtSystem.js"></script>
<script>
  const ns=TowerFrontier,Art=ns.systems.ArtSystem,canvas=document.querySelector('#preview'),ctx=canvas.getContext('2d');
  const art=Object.create(Art.prototype);
  function load(path){return new Promise((resolve,reject)=>{const image=new Image();image.assetSrc=path;image.onload=()=>{image.ready=true;resolve(image);};image.onerror=reject;image.src='../'+path;});}
  Promise.all([
    load('assets/td/enemy-grunt-actions-v1.png'),load('assets/td/enemy-brute-actions-v1.png'),
    load('assets/td/enemy-grunt-directions-v1.png'),load('assets/td/enemy-brute-directions-v1.png')
  ]).then(([grunt,brute,gruntDirections,bruteDirections])=>{
    art.enemyActions={grunt,brute};art.enemyDirections={grunt:gruntDirections,brute:bruteDirections};
    for(let row=0;row<2;row++)for(let col=0;col<4;col++){
      const type=row?'brute':'grunt',x=125+col*250,y=206+row*226;
      ctx.fillStyle=(row+col)%2?'#4f7d50':'#4a754d';ctx.fillRect(col*250,row*226,250,226);
      ctx.strokeStyle='#b3c59b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(col*250+22,y);ctx.lineTo(col*250+228,y);ctx.stroke();
      ctx.fillStyle='#f1f5dd';ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText((row?'岩甲巨獸':'普通步兵')+' · '+['向下走','向上走','向下攻擊','向上攻擊'][col],x,row*226+28);
      art.drawMonster(ctx,{type,x,y,radius:row?22:16,frame:col<2?2:2,state:col<2?'walk':'attack',visualHeading:col%2?-Math.PI/2:Math.PI/2,facing:0});
    }
  }).catch(error=>{document.querySelector('p').textContent='素材載入失敗：'+error.message;});
</script>
</html>
